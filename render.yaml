services:
  - type: web
    name: pulso-rede-criativa
    runtime: python
    plan: free
    region: virginia
    buildCommand: ./build.sh
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    healthCheckPath: /health/
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8

      # These secrets must survive service recreation. On an existing Blueprint,
      # Render preserves the values already stored in the Dashboard when sync is false.
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: FIELD_ENCRYPTION_KEY
        sync: false

      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com

      # Neon is the production source of truth. Keep the connection string only in
      # Render's secret environment; never reference or recreate Render Postgres here.
      - key: DATABASE_URL
        sync: false
      - key: PULSO_REQUIRE_NEON_DATABASE
        value: "1"
      - key: PULSO_EXPECTED_DATABASE_NAME
        value: pulso

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pulso-cache
          property: connectionString

  - type: keyvalue
    name: pulso-cache
    plan: free
    region: virginia
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
