<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <title>PULSO — sem conexão</title>
  <style>
    :root{font-family:Arial,sans-serif;color:#0b0b0c;background:#f7f6f2}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:28px}.card{width:min(560px,100%);background:#fff;border:1px solid #dfded8;border-radius:28px;padding:34px;box-shadow:0 22px 70px rgba(12,12,14,.12)}.mark{display:flex;align-items:center;gap:4px;width:52px;height:52px;padding:10px;border-radius:16px;background:#0b0b0c;transform:rotate(-7deg)}.mark i{display:block;width:8px;border-radius:20px;background:#caff37}.mark i:nth-child(1){height:20px}.mark i:nth-child(2){height:32px}.mark i:nth-child(3){height:25px}h1{font-size:clamp(34px,9vw,60px);line-height:.95;letter-spacing:-.06em;margin:28px 0 16px}p{font-size:17px;line-height:1.6;color:#56544f;margin:0 0 28px}button{border:0;border-radius:999px;background:#0b0b0c;color:#fff;font-weight:700;padding:14px 22px;font-size:15px}small{display:block;margin-top:18px;color:#77736d}
  </style>
</head>
<body>
  <main class="card">
    <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
    <h1>Seu pulso continua. A rede volta já.</h1>
    <p>Não foi possível alcançar o PULSO agora. Por segurança, publicações, mensagens, perfis privados e pagamentos não são exibidos a partir de uma cópia antiga.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
    <small>Quando a conexão voltar, o aplicativo retoma normalmente.</small>
  </main>
</body>
</html>
